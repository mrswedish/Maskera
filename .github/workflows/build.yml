name: Build Maskera

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      LIBCLANG_PATH: "C:\\Program Files\\LLVM\\bin"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm install

      - name: Delete existing latest release (preserves versioned releases like v0.5.0)
        run: gh release delete latest --yes --cleanup-tag
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        with:
          tagName: latest
          releaseName: "Maskera v0.6.0 — Latest Build (inkl. valbar Lager 4 / Judge)"
          releaseBody: |
            ## Nedladdning (v0.6.0)

            | Fil | Beskrivning |
            |---|---|
            | `Maskera-portabel.exe` | **Portabel** — kör direkt utan installation |
            | `Maskera_0.6.0_x64-setup.exe` | Installerare — installerar i Start-menyn |

            ### Nytt i v0.6.0
            - **Valbar Helhetsbedömning — Lager 4 (Judge) i *Klassificera information*:** Aktivt tillval (`Gemma 4 E2B`, ~2,62 GB lokal GGUF) som läser hela dokumentets sammanhang och överprövar lösryckta stycketräffar från Lager 3 (med en-klicks avinstallation för att frigöra diskutrymmet).
            - Basmodellerna för Lager 2 + Lager 3 (~318 MB) laddas ner automatiskt första gången och cachas lokalt.

            ### Tidigare version utan Lager 4 (Judge)
            - **[Maskera v0.5.0 — Lager 1–3 (utan Judge-funktionen)](https://github.com/mrswedish/Maskera/releases/tag/v0.5.0)** finns permanent sparad under Releases.
          releaseDraft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload portable EXE & publish versioned v0.6.0 release
        run: |
          Copy-Item "src-tauri/target/release/maskera.exe" "Maskera-portabel.exe"
          gh release upload latest "Maskera-portabel.exe" --clobber

          $setupExe = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          $msiFile  = Get-ChildItem -Path "src-tauri/target/release/bundle/msi/*.msi" | Select-Object -First 1

          gh release view v0.6.0 > $null 2>&1
          if ($LASTEXITCODE -ne 0) {
            gh release create v0.6.0 "Maskera-portabel.exe" $setupExe.FullName $msiFile.FullName `
              --title "Maskera v0.6.0 — Lager 1–3 + valbar Helhetsbedömning (Lager 4 / Judge)" `
              --notes "Version 0.6.0 med valbar lokal helhetsbedömning (**Lager 4 / Judge** med Gemma 4 E2B) i vyn *Klassificera information*. Föregående version utan Judge finns kvar här: [v0.5.0](https://github.com/mrswedish/Maskera/releases/tag/v0.5.0)." `
              --latest=false
          } else {
            gh release upload v0.6.0 "Maskera-portabel.exe" $setupExe.FullName $msiFile.FullName --clobber
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
