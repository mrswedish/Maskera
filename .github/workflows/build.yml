name: Build Maskera

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      LIBCLANG_PATH: "C:\\Program Files\\LLVM\\bin"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm install

      - name: Delete existing latest release (preserves versioned releases like v0.5.0)
        run: gh release delete latest --yes --cleanup-tag
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        with:
          tagName: latest
          releaseName: "Maskera v0.6.3 — Latest Build (Roll/Titel-maskering & skärpt Konto/Giro)"
          releaseBody: |
            ## Nedladdning (v0.6.3)

            | Fil | Beskrivning |
            |---|---|
            | `Maskera-portabel.exe` | **Portabel** — kör direkt utan installation |
            | `Maskera_0.6.3_x64-setup.exe` | Installerare — installerar i Start-menyn |

            ### Nytt i v0.6.3
            - **Maskering av yrkestitlar och roller (`+ Roll/Titel` → `[ROLL A]`):** Ny svensk sammansättnings- och ordlistemotor i Lager 1 (`0 MB`, `< 1 ms`) i *Avidentifiera för AI* som fångar befattningar och kvasidentifierare (t.ex. *biträdande verksamhetschef*, *informationssäkerhetssamordnaren*, *vård- och omsorgschefen*, *medicinskt ansvarig sjuksköterska*) utan att överlarma på falska vänner (*samtalstekniker*, *offentliga sektorn*, *skyddsvärda*, *personuppgiftsansvarig* m.fl.).
            - **Skärpt `Konto/Giro`-validering (Luhn Modulus 10):** Eliminering av falska träffar på siffer- och årtalsintervall som `1-3 år`, `2-6 månader` eller `2020-2024`, samtidigt som Bankgiro, PlusGiro, clearing+bankkonto och mellanslagsgrupperade IBAN fångas upp.

            ### Tidigare version utan Lager 4 (Judge)
            - **[Maskera v0.5.0 — Lager 1–3 (utan Judge-funktionen)](https://github.com/mrswedish/Maskera/releases/tag/v0.5.0)** finns permanent sparad under Releases.
          releaseDraft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload portable EXE & publish versioned v0.6.3 release
        run: |
          Copy-Item "src-tauri/target/release/maskera.exe" "Maskera-portabel.exe"
          gh release upload latest "Maskera-portabel.exe" --clobber

          $setupExe = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          $msiFile  = Get-ChildItem -Path "src-tauri/target/release/bundle/msi/*.msi" | Select-Object -First 1

          gh release view v0.6.3 > $null 2>&1
          if ($LASTEXITCODE -ne 0) {
            gh release create v0.6.3 "Maskera-portabel.exe" $setupExe.FullName $msiFile.FullName `
              --title "Maskera v0.6.3 — Roll/Titel-maskering & skärpt Konto/Giro" `
              --notes "Version 0.6.3 lägger till valbar maskering av yrkestitlar och befattningar (`+ Roll/Titel` → `[ROLL A]`, Steg 1A) i *Avidentifiera för AI* samt Luhn- och intervallvalidering för `Konto/Giro` (förhindrar falska träffar som `1-3 år`). Föregående version utan Judge finns kvar här: [v0.5.0](https://github.com/mrswedish/Maskera/releases/tag/v0.5.0)." `
              --latest=false
          } else {
            gh release upload v0.6.3 "Maskera-portabel.exe" $setupExe.FullName $msiFile.FullName --clobber
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
