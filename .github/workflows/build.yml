name: Build Maskera

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      LIBCLANG_PATH: "C:\\Program Files\\LLVM\\bin"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm install

      - name: Delete existing latest release (preserves versioned releases like v0.5.0)
        run: gh release delete latest --yes --cleanup-tag
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        with:
          tagName: latest
          releaseName: "Maskera v0.6.2 — Latest Build (Kalibrerad Lager 3 & Lager 4 / Judge)"
          releaseBody: |
            ## Nedladdning (v0.6.2)

            | Fil | Beskrivning |
            |---|---|
            | `Maskera-portabel.exe` | **Portabel** — kör direkt utan installation |
            | `Maskera_0.6.2_x64-setup.exe` | Installerare — installerar i Start-menyn |

            ### Nytt i v0.6.2 (Träffsäkerhetskalibrering av Lager 3 & Lager 4)
            - **Inga överlarm på generella termer i Lager 3:** Breda begrepp (*patient*, *diagnos*, *sjukskrivning*, *socialtjänst*, *lösenord*) i rutiner, verksamhetsutveckling/strategidokument och 1177-information triggar inte längre falsk Röd nivå, samtidigt som skarpa kliniska anteckningar och rehabuppföljningar fångas även utan personnummer.
            - **Personkontext & tvåvägsregel i Lager 4 (`Gemma 4 E2B`):** Judge ser omgivande kontext kring namngivna personer (uppdragstagare/kontaktpersoner i tjänsten vs faktisk patient/medarbetare) och kan nu både sänka falska Röda och höja underlarm till Röd.
            - **Snabbare Judge på långa gula dokument:** Färre överflödiga gula styckeutdrag sparar prefill-tid på CPU (ingen ny modellnedladdning krävs).

            ### Tidigare version utan Lager 4 (Judge)
            - **[Maskera v0.5.0 — Lager 1–3 (utan Judge-funktionen)](https://github.com/mrswedish/Maskera/releases/tag/v0.5.0)** finns permanent sparad under Releases.
          releaseDraft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload portable EXE & publish versioned v0.6.2 release
        run: |
          Copy-Item "src-tauri/target/release/maskera.exe" "Maskera-portabel.exe"
          gh release upload latest "Maskera-portabel.exe" --clobber

          $setupExe = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          $msiFile  = Get-ChildItem -Path "src-tauri/target/release/bundle/msi/*.msi" | Select-Object -First 1

          gh release view v0.6.2 > $null 2>&1
          if ($LASTEXITCODE -ne 0) {
            gh release create v0.6.2 "Maskera-portabel.exe" $setupExe.FullName $msiFile.FullName `
              --title "Maskera v0.6.2 — Kalibrerad Lager 3 & Lager 4 (Judge)" `
              --notes "Version 0.6.2 med skärpt precision för generella rutiner/strategitexter i **Lager 3** samt personkontext och tvåvägskontroll i **Lager 4 / Judge** (ingen ny modellnedladdning krävs). Föregående version utan Judge finns kvar här: [v0.5.0](https://github.com/mrswedish/Maskera/releases/tag/v0.5.0)." `
              --latest=false
          } else {
            gh release upload v0.6.2 "Maskera-portabel.exe" $setupExe.FullName $msiFile.FullName --clobber
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
