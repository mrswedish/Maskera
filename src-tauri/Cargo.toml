[package]
name = "maskera"
version = "0.6.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "maskera_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-shell = "2"
# NER-inferens native i Rust via Microsoft ONNX Runtime (statiskt länkad)
ort = { version = "2.0.0-rc.15", default-features = false, features = ["std", "ndarray", "download-binaries", "tls-native"] }
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex", "progressbar"] }
ndarray = "0.17"
regex = "1"
tauri-plugin-dialog = "2"
reqwest = { version = "0.12", default-features = false, features = ["stream", "native-tls"] }
futures-util = "0.3"
# Portabel dokumentimport (Word .docx/.odt, Excel .xlsx/.xls/.ods, PDF .pdf) helt i Rust
calamine = "0.28"
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
pdf-extract = "0.7"
# Lager 4 (Judge / Helhetsbedömning i Klassificera information) via llama.cpp (Gemma 4 E2B GGUF)
llama-cpp-2 = { version = "0.1.161", default-features = false, features = ["sampler"] }

[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-2 = { version = "0.1.161", default-features = false, features = ["metal", "sampler"] }

# ── Dev-profil: optimera dependencies med O3 även i debug-bygget ──────────────
[profile.dev.package."*"]
opt-level = 3
